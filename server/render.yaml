services:
  - type: web
    name: pg-server
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false

# Monorepo (client + server in one repo): use this buildCommand instead:
# buildCommand: npm install && cd ../client && npm install && npm run build && cd ../server
