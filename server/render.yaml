services:
  - type: web
    name: pg-server
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://pg-client-lawa.vercel.app
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure secret
      - key: MONGO_URI
        sync: false           # Set this manually in Render dashboard (keep secret)
      - key: PORT
        value: 10000          # Render default port
